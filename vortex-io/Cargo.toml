[package]
name = "vortex-io"
authors = { workspace = true }
categories = { workspace = true }
description = "Core async and blocking IO traits and implementations, used by IPC and file format"
edition = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[dependencies]
async-fs = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true, features = ["std", "executor"] }
glob = { workspace = true }
kanal = { workspace = true }
object_store = { workspace = true, optional = true, features = ["fs"] }
oneshot = { workspace = true }
parking_lot = { workspace = true }
pin-project-lite = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "rt",
    "sync",
] } # this is the maximum subset of fetaures that is safe for wasm32 targets
tracing = { workspace = true }
vortex-array = { workspace = true }
vortex-buffer = { workspace = true }
vortex-error = { workspace = true }
vortex-metrics = { workspace = true }
vortex-session = { workspace = true }
vortex-utils = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Optional: profiler labelling on the tokio executor's spawns. Behind the
# `profiling-labels` feature because the crate's build runs a C++ compile plus
# bindgen (dragging clang-sys and its closure) — a heavy toll to impose on
# every consumer for observability labels most never read.
custom-labels = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Smol backs the non-tokio threading models (single / current / pool). It is
# the default impl, so `smol-runtime` sits in the default feature set; a
# consumer that only ever drives Vortex through the tokio Executor can opt
# out with default-features = false and shed the second async runtime.
# Cannot be part of wasm.
smol = { workspace = true, optional = true }

# target_os = "unknown" matches wasm32-unknown-unknown (browser), excluding WASI targets
# where wasm-bindgen's JS interop is not available.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen-futures = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
itertools = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[features]
default = ["smol-runtime"]
object_store = ["dep:object_store", "vortex-error/object_store"]
# Label tokio-spawned work with custom-labels so external profilers attribute
# samples to Vortex tasks. Costs a C++ + bindgen build; see the dependency note.
profiling-labels = ["dep:custom-labels"]
# The smol-backed runtime modules (runtime::{single, current, pool}). On by
# default; see the smol dependency note.
smol-runtime = ["dep:smol"]
tokio = ["tokio/fs", "tokio/rt-multi-thread"]

[[example]]
name = "read_at_ablation"
required-features = ["object_store", "tokio"]

[lints]
workspace = true
